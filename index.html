<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoadEye · 道路病害自动巡检</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background:#0f1117; color:#e6e8ee; font-size:14px; }
  .wrap { display:flex; min-height:100vh; }
  aside { width:210px; background:#161922; border-right:1px solid #242a38; padding:18px 0; flex:none; }
  aside h1 { font-size:15px; margin:0 18px 4px; letter-spacing:.5px; }
  aside .sub { font-size:11px; color:#7b8398; margin:0 18px 18px; line-height:1.5; }
  nav button { display:block; width:100%; text-align:left; background:none; border:0;
               color:#a8b0c4; padding:10px 18px; cursor:pointer; font-size:13px;
               border-left:3px solid transparent; }
  nav button:hover { background:#1c2130; color:#e6e8ee; }
  nav button.on { background:#1c2130; color:#fff; border-left-color:#4a9eff; }
  nav button .num { color:#4a9eff; font-weight:600; margin-right:6px; }
  main { flex:1; padding:22px 26px 60px; max-width:1180px; }
  .head { border-left:3px solid #4a9eff; padding-left:12px; margin-bottom:20px; }
  .head h2 { margin:0 0 6px; font-size:19px; }
  .head .kv { color:#8a93a8; line-height:1.75; }
  .head .kv b { color:#cdd4e4; font-weight:600; }
  .head .num-line { color:#5fd28a; font-weight:600; }
  .card { background:#161922; border:1px solid #242a38; border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:14px; color:#cdd4e4; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { padding:6px 10px; text-align:right; border-bottom:1px solid #222836; }
  th:first-child, td:first-child { text-align:left; }
  th { color:#8a93a8; font-weight:500; font-size:12px; }
  tr.hi td { color:#5fd28a; font-weight:600; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .col { flex:1; min-width:280px; }
  img.out { width:100%; border-radius:6px; background:#000; display:block; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  button.act { background:#4a9eff; color:#fff; border:0; padding:7px 14px; border-radius:6px;
               cursor:pointer; font-size:13px; }
  button.act:hover { background:#3a8eef; }
  button.ghost { background:#1c2130; color:#a8b0c4; border:1px solid #2c3346; padding:6px 12px;
                 border-radius:6px; cursor:pointer; font-size:12px; }
  button.ghost.on { background:#243048; color:#fff; border-color:#4a9eff; }
  select,input[type=range],input[type=file] { background:#1c2130; color:#e6e8ee; border:1px solid #2c3346;
         border-radius:6px; padding:6px 8px; font-size:13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px;
           background:#1c2130; color:#8a93a8; margin-right:6px; }
  .badge.ok { background:#1b3327; color:#5fd28a; }
  .badge.bad { background:#3a1f22; color:#ff7a85; }
  .badge.warn{ background:#3a3320; color:#ffcc66; }
  .muted { color:#7b8398; font-size:12px; line-height:1.7; }
  .heat { font-family: ui-monospace, Consolas, monospace; font-size:12px; }
  pre { background:#0c0f16; border:1px solid #222836; border-radius:6px; padding:12px;
        overflow:auto; font-size:12px; color:#a8b0c4; max-height:320px; }
  .stat { font-size:12px; color:#8a93a8; }
  .stat b { color:#e6e8ee; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>RoadEye</h1>
    <p class="sub">基于行车记录仪的道路病害自动巡检<br>4 类：纵向裂缝 / 横向裂缝 / 龟裂 / 坑槽</p>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
const M = {                                     // 模块定义：三行说明 + 渲染函数
  m1: { num:"M1", name:"病害检测",  render: renderM1,
        problem:"给一段路面图，框出所有病害并给出类别",
        how:"YOLO11n · imgsz 640 · 12,838 张训练图 · 50 轮",
        numLine:"mAP50 0.418 / mAP50-95 0.203 · 推理 1.6 ms/张" },
  m2: { num:"M2", name:"切片推理对比", render: renderM2,
        problem:"小目标（坑槽、远端细裂缝）在整图推理时容易漏",
        how:"切 448×448 小块再放大到 640（目标放大 1.4 倍），与整图结果按类 NMS 合并",
        numLine:"recall 39.1% → 47.1%（+8.0 点）· 延迟 25 → 123 ms" },
  m3: { num:"M3", name:"尺度诊断",  render: renderM3,
        problem:"为什么 D40 坑槽只有 0.221，而 D20 龟裂有 0.612",
        how:"对每个 GT 框按面积分桶，统计各桶 recall（全量 4,509 图 / 11,471 框）",
        numLine:"极小目标 6% vs 大目标 60%（差 10 倍）· D40 有 47% 落在极小桶" },
  m4: { num:"M4", name:"图像质量前置", render: renderM4,
        problem:"夜间过曝、雨天反光、高速糊掉的图送进模型只会产生误检",
        how:"清晰度 / 亮度 / 过曝 / 对比度 四指标 → 判「这张能不能用」",
        numLine:"把不可判定的图挡在模型外面，而不是硬给一个结果" },
  m5: { num:"M5", name:"连续帧去重", render: renderM5,
        problem:"行车记录仪是视频流，同一个坑会被连续拍 30~50 帧",
        how:"整帧 dHash 汉明距离 + 框 IoU 双条件聚类（只判 pHash 会把相邻不同的坑误合并）",
        numLine:"147 框 → 16 点位（压缩 9.19×）· 按「出现 ≥6 帧」过滤后 11 个 = 真值" },
};

let samples = {};
let meta = {};

const el = (h) => { const d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; };

async function jget(u){ const r=await fetch(u); if(!r.ok) throw new Error((await r.text()).slice(0,200)); return r.json(); }
async function jpost(u,b){ const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
                           if(!r.ok) throw new Error((await r.text()).slice(0,300)); return r.json(); }
const pct = (v)=> (v*100).toFixed(1)+'%';
const f3 = (v)=> (typeof v==='number'? v.toFixed(3) : v);

/* ---------------- 模块 1：检测 ---------------- */
function renderM1(root){
  const flat = Object.values(samples).flat();
  root.appendChild(el(`
    <div class="card">
      <h3>点一张图，看检测结果</h3>
      <div class="btnrow">
        <select id="m1sel">${flat.map(f=>`<option>${f}</option>`).join('')}</select>
        <button class="act" id="m1go">检测</button>
        <span class="muted">共 ${flat.length} 张预置样例（全部来自验证集）</span>
      </div>
      <div class="row">
        <div class="col"><img class="out" id="m1img" alt=""></div>
        <div class="col">
          <div id="m1stat" class="stat"></div>
          <div id="m1tbl"></div>
        </div>
      </div>
    </div>`));
  const run = async ()=>{
    const s = document.getElementById('m1sel').value;
    document.getElementById('m1stat').innerHTML = '推理中…';
    try{
      const r = await jpost('/api/detect',{sample:s, mode:'whole'});
      document.getElementById('m1img').src = 'data:image/jpeg;base64,'+r.image_b64;
      document.getElementById('m1stat').innerHTML =
        `检出 <b>${r.n_dets}</b> 个目标　耗时 <b>${r.elapsed_ms}</b> ms　图像 <b>${r.img_shape[0]}×${r.img_shape[1]}</b>`;
      document.getElementById('m1tbl').innerHTML = CLASS_TABLE(r.counts);
    }catch(e){ document.getElementById('m1stat').textContent = '出错：'+e.message; }
  };
  document.getElementById('m1go').onclick = run; run();
}

function CLASS_TABLE(counts){
  const rows = Object.entries(counts).map(([k,v])=>
    `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  return `<table><thead><tr><th>类别</th><th>本图检出</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------------- 模块 2：切片对比 ---------------- */
function renderM2(root){
  const flat = Object.values(samples).flat();
  root.appendChild(el(`
    <div class="card">
      <h3>同一张图：整图推理 vs 融合推理</h3>
      <div class="btnrow">
        <select id="m2sel">${flat.map(f=>`<option>${f}</option>`).join('')}</select>
        <button class="act" id="m2go">对比</button>
        <span class="muted">融合 = 整图 + 448 切片，按类 NMS 合并</span>
      </div>
      <div class="row">
        <div class="col"><div class="badge">整图 @640（基线）</div>
          <img class="out" id="m2a" alt=""><div id="m2sa" class="stat"></div></div>
        <div class="col"><div class="badge ok">整图 + 切片 融合 ★</div>
          <img class="out" id="m2b" alt=""><div id="m2sb" class="stat"></div></div>
      </div>
    </div>
    <div class="card"><h3>离线实验：四组方案对照（随机 1200 张）</h3><div id="m2tbl">加载中…</div></div>
    <div class="card"><h3>参数扫描：精度 vs 延迟</h3><div id="m2sweep">加载中…</div></div>`));

  const run = async ()=>{
    const s = document.getElementById('m2sel').value;
    document.getElementById('m2sa').textContent='推理中…';
    document.getElementById('m2sb').textContent='';
    try{
      const r = await jpost('/api/compare',{sample:s, conf:0.25, tile:448, overlap:0.25});
      document.getElementById('m2a').src='data:image/jpeg;base64,'+r.whole.image_b64;
      document.getElementById('m2b').src='data:image/jpeg;base64,'+r.fusion.image_b64;
      document.getElementById('m2sa').innerHTML =
        `检出 <b>${r.whole.n_dets}</b> 个　<b>${r.whole.elapsed_ms}</b> ms　切片 0 块`;
      document.getElementById('m2sb').innerHTML =
        `检出 <b>${r.fusion.n_dets}</b> 个　<b>${r.fusion.elapsed_ms}</b> ms　切片 ${r.fusion.n_tiles} 块`;
    }catch(e){ document.getElementById('m2sa').textContent='出错：'+e.message; }
  };
  document.getElementById('m2go').onclick = run; run();

  jget('/api/m/m2').then(d=>{
    const bk = d.buckets;
    const rows = d.modes.map(x=>`<tr class="${x.key==='D'?'hi':''}">
      <td>${x.name}</td><td>${x.recall}%</td>
      ${bk.map(b=>`<td>${x.buckets[b]}%</td>`).join('')}
      <td>${x.ms}</td></tr>`).join('');
    document.getElementById('m2tbl').innerHTML =
      `<table><thead><tr><th>模式</th><th>合计 recall</th>${bk.map(b=>`<th>${b}</th>`).join('')}<th>ms/张</th></tr></thead>
       <tbody>${rows}</tbody></table>
       <p class="muted">${d.conclusion.map(c=>'· '+c).join('<br>')}</p>`;
    const sr = d.sweep.map(x=>`<tr class="${x.best?'hi':''}">
      <td>tile ${x.tile} / overlap ${x.overlap}${x.best?' ★':''}</td>
      <td>${x.recall}%</td><td>${x.ms} ms</td></tr>`).join('');
    document.getElementById('m2sweep').innerHTML =
      `<table><thead><tr><th>配置</th><th>recall</th><th>延迟</th></tr></thead><tbody>${sr}</tbody></table>`;
  }).catch(e=>{ document.getElementById('m2tbl').textContent='读不到 m2_slice.json：'+e.message; });
}

/* ---------------- 模块 3：尺度诊断 ---------------- */
function renderM3(root){
  root.appendChild(el(`<div class="card"><h3>按目标面积分桶的 recall（全量 4,509 图）</h3><div id="m3a">加载中…</div></div>
    <div class="card"><h3>各目标实际像素尺寸</h3><div id="m3b">加载中…</div></div>`));
  jget('/api/m/m3').then(d=>{
    const heat = (v)=>{
      const t = Math.min(1, v/100);
      const r = Math.round(255*(1-t)), g = Math.round(80+155*t);
      return `background:rgba(${r},${g},90,.22)`;
    };
    const rows = d.rows.map(r=>{
      const cells = r.hit.map((h,i)=>{
        const t=r.tot[i]; const v = t? h/t*100 : 0;
        return `<td class="heat" style="${heat(v)}">${t? h+'/'+t+' '+v.toFixed(0)+'%' : '—'}</td>`;
      }).join('');
      return `<tr><td>${r.code} ${r.zh}</td>${cells}</tr>`;
    }).join('');
    document.getElementById('m3a').innerHTML =
      `<table><thead><tr><th>类别</th>${d.buckets.map(b=>`<th>${b}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
       <p class="muted">${d.meta.conclusion}</p>`;
    const sr = d.size_stats.map(x=>`<tr><td>${x.code}</td><td>${x.area_pct_median}%</td>
      <td>${x.long_side_px} px</td><td>${x.aspect_median}</td></tr>`).join('');
    document.getElementById('m3b').innerHTML =
      `<table><thead><tr><th>类别</th><th>面积占比中位</th><th>较长边</th><th>长宽比中位</th></tr></thead>
       <tbody>${sr}</tbody></table>`;
  }).catch(e=>{ document.getElementById('m3a').textContent='读不到 m3_scale.json：'+e.message; });
}

/* ---------------- 模块 4：图像质量 ---------------- */
function renderM4(root){
  const flat = Object.values(samples).flat();
  root.appendChild(el(`
    <div class="card">
      <h3>喂一张图，看它「能不能用于判定」</h3>
      <div class="btnrow">
        <select id="m4sel">${flat.map(f=>`<option>${f}</option>`).join('')}</select>
        <span class="muted">或点右边选本地图</span>
        <input type="file" id="m4file" accept="image/*">
      </div>
      <div class="btnrow" id="m4degs">
        <span class="muted">注入退化：</span>
        <button class="ghost" data-d="blur">模糊</button>
        <button class="ghost" data-d="dark">变暗</button>
        <button class="ghost" data-d="overexpose">过曝</button>
        <button class="ghost" data-d="noise">噪声</button>
        <button class="ghost" data-d="jpeg">JPEG压缩</button>
        <input type="range" id="m4lv" min="0.1" max="1" step="0.1" value="0.6">
        <span class="muted" id="m4lvt">0.6</span>
      </div>
      <div class="row">
        <div class="col"><div class="badge">原图</div><img class="out" id="m4a"><div id="m4sa" class="stat"></div></div>
        <div class="col"><div class="badge bad">退化后</div><img class="out" id="m4b"><div id="m4sb" class="stat"></div></div>
      </div>
    </div>
    <div class="card"><h3>四个指标与阈值</h3><div id="m4tbl">加载中…</div></div>`));

  let curB64 = null, degrade = null;
  const call = async ()=>{
    const body = {degrade, level: parseFloat(document.getElementById('m4lv').value)};
    if (curB64) body.image_b64 = curB64;
    else body.sample = document.getElementById('m4sel').value;
    try{
      const r = await jpost('/api/quality', body);
      document.getElementById('m4a').src='data:image/jpeg;base64,'+r.image_b64;
      const fmt=(q)=>`<span class="badge ${q.usable?'ok':'bad'}">${q.usable?'可用':'不可用'}</span>
        清晰度 <b>${q.sharpness}</b>　亮度 ${q.brightness}　过曝 ${(q.overexposure*100).toFixed(1)}%　
        对比度 ${q.contrast}<br><span class="muted">${q.reason}</span>`;
      document.getElementById('m4sa').innerHTML = fmt(r.original);
      if(r.degraded){
        document.getElementById('m4b').src='data:image/jpeg;base64,'+r.degraded_image_b64;
        document.getElementById('m4sb').innerHTML = fmt(r.degraded);
      }else{
        document.getElementById('m4b').removeAttribute('src');
        document.getElementById('m4sb').textContent='（选一个退化按钮）';
      }
    }catch(e){ document.getElementById('m4sa').textContent='出错：'+e.message; }
  };
  document.getElementById('m4sel').onchange = ()=>{ curB64=null; call(); };
  document.getElementById('m4file').onchange = (ev)=>{
    const f = ev.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ curB64 = rd.result; call(); };
    rd.readAsDataURL(f);
  };
  document.querySelectorAll('#m4degs button').forEach(b=>{
    b.onclick = ()=>{
      degrade = (degrade===b.dataset.d)? null : b.dataset.d;
      document.querySelectorAll('#m4degs button').forEach(x=>x.classList.toggle('on', x.dataset.d===degrade));
      call();
    };
  });
  document.getElementById('m4lv').oninput = (e)=>{
    document.getElementById('m4lvt').textContent = e.target.value; if(degrade) call();
  };
  call();

  jget('/api/m/m4').then(d=>{
    const t = d.thresholds_live || d.thresholds;
    const rows = Object.entries(t).map(([k,v])=>`<tr><td>${k}</td><td>${JSON.stringify(v)}</td></tr>`).join('');
    document.getElementById('m4tbl').innerHTML =
      `<table><thead><tr><th>参数</th><th>当前值</th></tr></thead><tbody>${rows}</tbody></table>
       <p class="muted">${d.meta.method}</p>`;
  }).catch(e=>{ document.getElementById('m4tbl').textContent = e.message; });
}

/* ---------------- 模块 5：连续帧去重 ---------------- */
function renderM5(root){
  const groups = Object.values(samples).flat();
  root.appendChild(el(`
    <div class="card">
      <h3>离线基准：12 帧模拟车驶过序列（源图含 11 个真实病害）</h3>
      <div id="m5base" class="stat">加载中…</div>
    </div>
    <div class="card">
      <h3>选一组「连续帧」，看它们被归并成几个病害点位</h3>
      <div class="btnrow">
        <select id="m5sel" multiple size="6" style="min-width:420px">
          ${groups.map(f=>`<option>${f}</option>`).join('')}
        </select>
        <div>
          <button class="act" id="m5go">去重</button><br>
          <button class="ghost" id="m5all" style="margin-top:6px">全选前 12 张</button>
        </div>
      </div>
      <div id="m5stat" class="stat"></div>
      <div id="m5tbl"></div>
    </div>
    <div class="card"><h3>判定规则</h3><div id="m5rule" class="muted">加载中…</div></div>`));

  document.getElementById('m5all').onclick = ()=>{
    const sel = document.getElementById('m5sel');
    [...sel.options].forEach((o,i)=> o.selected = i<12);
  };
  document.getElementById('m5go').onclick = async ()=>{
    const sel = [...document.getElementById('m5sel').selectedOptions].map(o=>o.value);
    document.getElementById('m5stat').textContent = `处理 ${sel.length} 帧…`;
    try{
      const r = await jpost('/api/dedup',{samples:sel, conf:0.25});
      const half = Math.ceil(r.n_frames/2);
      const ge3  = r.groups.filter(g=>g.frames.length>=3).length;
      const stable = r.groups.filter(g=>g.frames.length>=half).length;
      document.getElementById('m5stat').innerHTML =
        `输入 <b>${r.n_frames}</b> 帧，原始检测框 <b>${r.n_raw_boxes}</b> 个
         → 归并为 <b>${r.n_unique_points}</b> 个唯一病害点位　
         压缩比 <b>${r.reduction_ratio}×</b><br>
         出现 ≥3 帧：<b>${ge3}</b> 个　
         出现 ≥${half} 帧（半数，推荐口径）：<b>${stable}</b> 个`;
      const rows = r.groups.slice(0,40).map(g=>{
        const ok = g.frames.length >= half;
        return `<tr${ok?' class="hi"':''}>
        <td>#${g.group_id}</td><td>${g.cls_short || ('cls'+g.class)}${g.cls_zh?' '+g.cls_zh:''}</td>
        <td>${g.frames.length}</td>
        <td>${g.frames.join(',')}</td><td>${g.max_conf.toFixed(3)}</td></tr>`;
      }).join('');
      document.getElementById('m5tbl').innerHTML =
        `<p class="muted">绿色行 = 出现 ≥${half} 帧（半数）的稳定点位，可交付；
         其余是跨帧边缘噪声，丢掉不影响召回。</p>
         <table><thead><tr><th>点位</th><th>类别</th><th>出现帧数</th><th>帧索引</th><th>最高置信度</th></tr></thead>
         <tbody>${rows}</tbody></table>`;
    }catch(e){ document.getElementById('m5stat').textContent='出错：'+e.message; }
  };
  jget('/api/m/m5').then(d=>{
    const p = d.params_live || d.params;
    const ms = d.measured || {};
    if(ms.n_frames){
      const sweep = (ms.conf_sweep || []).map(s=>`<tr${s.n_ge6_frames===ms.ground_truth_points?' class="hi"':''}>
        <td>${s.conf.toFixed(2)}</td><td>${s.n_raw_boxes}</td><td>${s.n_points}</td>
        <td>${s.n_ge3_frames}</td><td>${s.n_ge6_frames}</td></tr>`).join('');
      document.getElementById('m5base').innerHTML =
        `输入 12 帧 → 原始 <b>${ms.n_raw_boxes}</b> 个框 → 归并成 <b>${ms.n_unique_points}</b> 个点位，
         压缩 <b>${ms.reduction_ratio}×</b>。<br>
         但 16 个里有 5 个只出现 1~5 帧（边缘拉伸假阳性）。真实病害应在一半以上的帧里可见，
         按「${ms.stable_rule}」过滤后剩 <b>${ms.stable_points}</b> 个 ——
         与源图真值 <b>${ms.ground_truth_points}</b> 个完全一致。<br><br>
         <span class="muted">${ms.note || ''}</span>
         ${sweep?`<br><br><b>置信度扫描（绿行 = 过滤后恰好等于真值）</b>
         <table style="margin-top:8px"><thead><tr>
           <th>conf</th><th>原始框</th><th>归并点位</th><th>出现≥3帧</th><th>出现≥6帧</th>
         </tr></thead><tbody>${sweep}</tbody></table>
         <p class="muted">${ms.sweep_conclusion || ''}</p>`:''}`;
    } else {
      document.getElementById('m5base').textContent = '（未运行离线基准，点下方“去重”现场验证）';
    }
    document.getElementById('m5rule').innerHTML =
      `${d.meta.rule}<br><br>当前参数：` +
      Object.entries(p).map(([k,v])=>`<code>${k}=${v}</code>`).join('　') +
      `<br><br>数据集证据：${d.meta.dataset_evidence}`;
  }).catch(()=>{});
}

/* ---------------- 导航 ---------------- */
function boot(){
  const nav = document.getElementById('nav');
  Object.entries(M).forEach(([k,m],i)=>{
    const b = el(`<button data-k="${k}"><span class="num">${m.num}</span>${m.name}</button>`);
    if(i===0) b.classList.add('on');
    b.onclick = ()=>go(k);
    nav.appendChild(b);
  });
  go('m1');
}

function go(k){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  const m = M[k];
  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(el(`
    <div class="head">
      <h2>${m.num} · ${m.name}</h2>
      <div class="kv">
        <b>解决什么问题</b>　${m.problem}<br>
        <b>怎么做的</b>　　${m.how}<br>
        <span class="num-line">${m.numLine}</span>
      </div>
    </div>`));
  try{ m.render(main); }catch(e){ main.appendChild(el(`<div class="card">渲染失败：${e.message}</div>`)); }
}

(async ()=>{
  try{
    samples = await jget('/api/samples');
    meta = await jget('/api/meta');
  }catch(e){ console.error(e); }
  boot();
})();
</script>
