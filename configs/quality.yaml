# ============================================================
# 图像质量前置阈值（M4 模块）
# ★ 数值由 tools/calibrate_quality.py 在验证集上实测标定后回填，
#   标定结果见 assets/results/quality_calib.json
# ============================================================

# 清晰度：cv2.Laplacian(gray, cv2.CV_64F).var()
# 行车记录仪抖动/夜间容易糊，需要先挡掉
# 实测：验证集 P1=39.2 / P5=78.9 / P50=1200，60 大约卡掉 2.8%
sharpness_min: 60.0

# 亮度均值范围（0~255）
# 实测：验证集 P1=66.4 / P99=187.5，所以 30~225 基本不触发（保险丝作用）
brightness_range: [30, 225]

# 过曝像素比例上限（gray > 250 的占比）
# ★ 原来是 0.05，实测会把 28.3% 的正常验证图误判为过曝
#   —— 因为路面高光、天空、白线本身就是超白像素，正常图 P90 就有 0.17
# 改成 0.20 后误杀降到 8.3%，同时仍能检出 60% 的中度过曝
# 局限：单看过曝比例区分度有限，更好的做法是叠加局部对比度（见 E8）
overexposure_max: 0.20

# 欠曝像素比例上限（gray < 5 的占比）
# 实测：验证集 P99=0.11，所以 0.30 基本不触发
underexposure_max: 0.30

# 对比度下限：gray.std()
# 实测：验证集 P1=12.5 / P5=25.1，18 大约卡掉 2.8%
contrast_min: 18.0

# 连续多少项不达标才判"不可用"（1 = 任一不达标即不可用）
fail_votes: 1
