# ============================================================
# 连续帧去重参数（M5 模块）
# 行车记录仪是视频流，同一个坑会被连续拍 30~50 帧
# ============================================================

# 判断"两帧是同一场景"的差分哈希汉明距离上限（0~64，越小越严）
# 实测参考：同一场景相邻帧 ≈ 0~6；同场景不同角度 ≈ 8~16；不同场景 > 20
phash_hamming_max: 8

# 判断"两个框是同一个病害"的 IoU 下限
iou_min: 0.3

# 两帧之间最多隔多少帧还算同一组（超过就断开）
max_gap_frames: 45

# 只合并同一类别的框（D00 和 D40 相邻也不能合并）
same_class_only: true

# 组内保留哪一帧：conf（置信度最高）/ area（框最大）/ middle（中间帧）
keep_strategy: conf
