# ============================================================
# 数据集与划分配置
# ★ 类别定义全项目只在这一处写；其它脚本一律读这里
# ============================================================

# 数据集已经给好了 train/val 划分，所以 seed 只用于任何后续重采样
seed: 42

# 类别（顺序必须与 data.yaml 的 names 完全一致，不能改顺序！）
nc: 4
names:
  0: Longitudinal Crack (D00)     # 纵向裂缝
  1: Transverse Crack (D10)       # 横向裂缝
  2: Alligator Crack (D20)        # 龟裂（网状裂缝）
  3: Pothole (D40)                # 坑槽

# 简称映射（画图/报告里用，保持简短）
short:
  0: D00
  1: D10
  2: D20
  3: D40

# 中文名（报告/页面里显示）
zh:
  0: 纵向裂缝
  1: 横向裂缝
  2: 龟裂
  3: 坑槽

# 拍摄来源（数据集本身混合了三种视角，评测时可按来源拆分）
sources:
  rdd: 车载视角（RDD2022 原图）
  uav: 无人机视角
  rdv: 视频帧（★ 连续帧去重模块就用这一部分）
