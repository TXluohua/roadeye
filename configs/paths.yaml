# ============================================================
# RoadEye 项目路径配置
# ★ 全项目唯一允许出现路径的地方（代码里不许写死路径）
# ============================================================

# 数据集根目录（解压后的位置，里面有 data.yaml）
dataset_root: data/raw/unified
dataset_yaml: data/raw/unified/data.yaml

# 下载缓存（tar.gz 放这里，可删）
download_dir: data/_dl

# 离线脚本产出的预计算结果（演示台只读这里）
results_dir: assets/results

# 预置样例（每个模块 3~5 张，★ 必须来自 val，不能用 train）
samples_dir: assets/samples

# 模型权重
weights: assets/models/best.pt

# probe.py 导出的框校验图
probe_issues_dir: assets/probe_issues

# 训练输出（ultralytics 的 project/name）
runs_dir: runs
